name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '217.217.253.11' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== Starting GoClaw Deployment on VPS ==="
            cd /opt/goclaw

            # Pull latest changes if git repository is set up
            if [ -d .git ]; then
              echo "Pulling latest code..."
              git pull origin main || git pull origin master || true
            fi

            # Pull latest docker images
            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml pull

            # Recreate containers
            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d

            # Run database migrations / upgrade
            echo "Running database upgrade..."
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade

            # Health check
            echo "Checking gateway health..."
            sleep 5
            curl -f http://127.0.0.1:18790/health || (echo "Health check failed!" && exit 1)

            echo "=== Deployment Successfully Completed! ==="
